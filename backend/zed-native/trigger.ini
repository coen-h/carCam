# Shadow/calibration configuration for the Nano-side ZED vehicle trigger.
#
# ZED IMAGE coordinates are measured in millimetres:
#   X: right, Y: down, Z: forward from the left camera.
# The production 3D zone will be filled in after observing real vehicle
# positions at the installed camera angle.

[trigger]
enabled=true
shadow-mode=true
state-path=/home/coen/zed-native-rtsp/state/trigger-state.json
min-confidence=40
min-observations=3
confirmation-window-ms=1500
hold-seconds=12
status-interval-ms=1000

[classes]
car=true
truck=true
bus=true
motorbike=false

[zone]
# Disabled means all qualifying vehicles are reported for calibration. Shadow
# mode guarantees that these observations cannot control the live stream.
enabled=false
min-x-mm=-10000
max-x-mm=10000
min-y-mm=-10000
max-y-mm=10000
min-z-mm=0
max-z-mm=20000
