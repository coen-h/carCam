[depth-trigger]
# Production-ready observer configuration. It remains non-actionable until the
# final entrance geometry and outdoor vehicle tests have passed.
sample-width=160
sample-height=90
sample-interval-ms=250
calibration-seconds=30
startup-settle-seconds=15

# Placeholder full-frame polygon. Replace this with the installed entrance lane.
# Coordinates are in the low-resolution depth sample, not the 1920x1080 image.
roi-polygon=0,0;160,0;160,90;0,90
# Separate exclusion polygons with |.
exclude-polygons=

min-depth-mm=500
max-depth-mm=12000
min-closer-mm=500
min-changed-pixels=150
min-changed-fraction=0.04
confirm-samples=2
clear-samples=3
hold-seconds=10

# Unreliable depth fails open (occupied). Sustained broad, bidirectional
# displacement reports camera_moved until explicit recalibration.
min-valid-fraction=0.30
unreliable-confirm-samples=8
movement-delta-mm=750
movement-fraction=0.45
movement-bidirectional-fraction=0.08
movement-confirm-samples=20

shadow-mode=true
auto-calibrate-if-missing=false
state-path=/dev/shm/parkinglot-depth-trigger-state.json
baseline-path=/home/coen/zed-native-rtsp/state/depth-baseline-v2.bin
calibration-request-path=/dev/shm/parkinglot-depth-calibrate.request
event-path=/home/coen/zed-native-rtsp/state/depth-events.jsonl
event-max-bytes=5242880
event-backups=3
