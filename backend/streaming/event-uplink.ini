[uplink]
state-path=/dev/shm/parkinglot-depth-trigger-state.json
status-path=/dev/shm/parkinglot-event-uplink-state.json
force-path=/dev/shm/parkinglot-event-uplink.force
control-url=http://100.64.0.6:9010/v1/lease
token-path=/home/coen/parkinglot-streaming/control-token
poll-seconds=0.25
heartbeat-seconds=1.0
request-timeout-seconds=2.0
state-max-age-seconds=3.0

# Real occupied/hold events are not time-limited. Depth faults fail open for a
# bounded interval, then cool down so a dirty lens or failed depth feed cannot
# consume an entire cellular allowance unattended.
fault-max-stream-seconds=60.0
fault-retry-seconds=300.0
